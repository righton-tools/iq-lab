<script id="core">
const CORE=(()=>{
'use strict';
const SQ=Math.sqrt;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function shuffle(arr,seed){const r=mulberry32(seed);const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function canon(o){if(Array.isArray(o))return o.map(canon);if(o&&typeof o==='object'){const r={};Object.keys(o).sort().forEach(k=>{r[k]=canon(o[k])});return r}return o}
const key=o=>JSON.stringify(canon(o));

/* ---------- statistics (normal distribution, 3PL IRT, EAP) ---------- */
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y}
const Phi=z=>0.5*(1+erf(z/Math.SQRT2));
function invNorm(p){
  const a=[-3.969683028665376e+01,2.209460984245205e+02,-2.759285104469687e+02,1.383577518672690e+02,-3.066479806614716e+01,2.506628277459239e+00];
  const b=[-5.447609879822406e+01,1.615858368580409e+02,-1.556989798598866e+02,6.680131188771972e+01,-1.328068155288572e+01];
  const c=[-7.784894002430293e-03,-3.223964580411365e-01,-2.400758277161838e+00,-2.549732539343734e+00,4.374664141464968e+00,2.938163982698783e+00];
  const d=[7.784695709041462e-03,3.224671290700398e-01,2.445134137142996e+00,3.754408661907416e+00];
  const pl=0.02425,ph=1-pl;let q,r;
  if(p<pl){q=SQ(-2*Math.log(p));return(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1)}
  if(p<=ph){q=p-0.5;r=q*q;return(((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1)}
  q=SQ(-2*Math.log(1-p));return-(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
function bFrom(p,c,a){let pp=(p-c)/(1-c);pp=Math.min(.985,Math.max(.02,pp));return-invNorm(pp)*SQ(1+a*a)/a}
function P(it,th){return it.c+(1-it.c)*Phi(it.a*(th-it.b))}
function eap(items,resp){
  const G=[];for(let t=-4;t<=4.001;t+=0.05)G.push(t);
  const w=G.map(t=>{let ll=-t*t/2;items.forEach((it,i)=>{const p=Math.min(.9999,Math.max(.0001,P(it,t)));ll+=resp[i]?Math.log(p):Math.log(1-p)});return ll});
  const m=Math.max.apply(null,w);const ws=w.map(x=>Math.exp(x-m));
  let sw=0,st=0;ws.forEach((x,i)=>{sw+=x;st+=x*G[i]});const th=st/sw;
  let sv=0;ws.forEach((x,i)=>{sv+=x*(G[i]-th)*(G[i]-th)});
  return{theta:th,sd:SQ(sv/sw)};
}

/* ---------- domains ---------- */
const DOM={mat:'行列推理',ser:'図形系列',spa:'空間認識',num:'数的推理',ver:'言語理解',ari:'算数推理',log:'論理推理',mem:'作動記憶'};
const DOM_DESC={
  mat:'3×3のマスに並んだ図形には規則があります。規則を見つけて、空欄（?）に入る図形を選んでください。',
  ser:'左から順に並ぶ図形には変化の規則があります。次に来る図形を選んでください。',
  spa:'図形の回転、紙を折って穴をあける、積み木の個数など、頭の中で形を動かす問題です。',
  num:'数の並びの規則を見つけて、次に来る数を選んでください。',
  ver:'言葉の関係、仲間外れ、共通点、語彙を問います。',
  ari:'文章題を暗算で解きます。紙や電卓は使わないでください。',
  log:'与えられた条件から、確実に言えることを導いてください。',
  mem:'数字が1つずつ表示されます。すべて消えたあと、指示された順番で数字を入力してください。'
};
const INDEX={mat:'pr',ser:'pr',spa:'pr',num:'ql',ari:'ql',log:'ql',ver:'vc',mem:'wm'};
const INDEX_NAME={pr:'知覚推理',vc:'言語理解',ql:'数理・論理',wm:'作動記憶'};
const LIMITS={mat:120,ser:90,spa:120,num:90,ver:45,ari:120,log:150,mem:0};

/* ---------- figure specs ---------- */
const C=(s,f,x)=>Object.assign({s:s,f:f||'n',n:1,r:0,z:'m'},x||{});
const SEG=(seg,x)=>Object.assign({s:'none',f:'n',n:1,r:0,z:'m',seg:seg.slice().sort()},x||{});
const D=(s,dot,f)=>C(s,f||'n',{z:'l',dot:dot});
const I=(o,s,f)=>C(o,'n',{z:'l',in:{s:s,f:f}});
const X=(seg,s)=>SEG(seg,{in:{s:s,f:'f'}});
const Y=(seg,f)=>SEG(seg,{in:{s:'tri',f:f}});
/* polyominoes */
const norm=p=>{const mx=Math.min.apply(null,p.map(q=>q[0])),my=Math.min.apply(null,p.map(q=>q[1]));return p.map(q=>[q[0]-mx,q[1]-my]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])};
const rot90=p=>p.map(q=>[-q[1],q[0]]);
const mir=p=>p.map(q=>[-q[0],q[1]]);
const rotN=(p,k)=>{for(let i=0;i<k;i++)p=rot90(p);return p};
const pk=p=>JSON.stringify(norm(p));
const isRot=(a,b)=>{for(let k=0;k<4;k++)if(pk(rotN(a,k))===pk(b))return true;return false};
/* paper folding: L/R fold the left/right half over, T/B the top/bottom half */
function foldSteps(folds){const steps=[];let reg={r0:0,r1:3,c0:0,c1:3};folds.forEach(f=>{const before=Object.assign({},reg);let line;if(f==='L'||f==='R'){const mid=(reg.c0+reg.c1+1)/2;line={axis:'c',mid:mid};if(f==='L')reg.c0=mid;else reg.c1=mid-1}else{const mid=(reg.r0+reg.r1+1)/2;line={axis:'r',mid:mid};if(f==='T')reg.r0=mid;else reg.r1=mid-1}steps.push({before:before,f:f,line:line})});return{steps:steps,reg:reg}}
function unfold(folds,punch){const st=foldSteps(folds);let holes=punch.slice();for(let i=st.steps.length-1;i>=0;i--){const l=st.steps[i].line;const m=holes.map(h=>l.axis==='c'?[h[0],2*l.mid-1-h[1]]:[2*l.mid-1-h[0],h[1]]);holes=holes.concat(m)}return holes}
const hk=h=>JSON.stringify(h.map(x=>x.join(',')).sort());

const PL=[[0,0],[0,1],[0,2],[1,2]];
const PP=[[0,0],[1,0],[0,1],[1,1],[0,2]];
const PH=[[0,0],[1,0],[2,0],[2,1],[3,1],[0,-1]];
const F1=['L'],F1P=[[1,2]];
const F2=['T','L'],F2P=[[3,2]];
const F3=['T','L'],F3P=[[2,2],[3,3]];
const F4=['L','T','L'],F4P=[[2,3]];

/* ---------- item bank (p = estimated pass rate of general adults, a = discrimination) ---------- */
const QM='空欄（?）に入る図形はどれ？';
const QS='次に来る図形はどれ？';
const QN='次に来る数は？';

const GEN=(function(){

const out=[];const cnt={};

  const st=Math.abs(ans)>=1000?100:Math.abs(ans)>=200?10:1;cands.concat([ans+st,ans-st,ans+2*st,ans-2*st,ans+3*st,ans-3*st,ans+5*st,ans+10*st]).forEach(x=>{x=r1(x);if(s.length<5&&Number.isFinite(x)&&x>=m&&!s.includes(x))s.push(x)});return s.map(fmt)}
function textOpts(ans,ds){const s=[ans];ds.forEach(d=>{if(s.length<5&&!s.includes(d))s.push(d)});return s}

/* ---------- 数的推理：10パターン×8問 ---------- */
const addN=(seq,ans,cands,p,exp)=>out.push({id:nid('GN'),dom:'num',p:p,q:QN,stim:{kind:'seq',text:seq.join(',  ')+',  ?'},opts:numOpts(ans,cands),exp:exp});
for(let i=0;i<8;i++){
  {let a=ri(2,30),d=ri(3,13);if(R()<.3){d=-d;a=ri(80,130)}const s=[0,1,2,3,4].map(k=>a+k*d),ans=a+5*d;
   addN(s,ans,[ans+d,a+6*d,ans-2*d],.78,'毎回'+(d>0?d+'ずつ増える':(-d)+'ずつ減る')+'。次は'+ans+'。')}
  {const r=pick([2,3,4]),n=r===4?4:5,a=r===4?ri(1,3):ri(1,6);const s=[];for(let k=0;k<n;k++)s.push(a*Math.pow(r,k));const ans=a*Math.pow(r,n),last=s[n-1];
   addN(s,ans,[last+(last-s[n-2]),last*(r+1),ans/r*(r-1)+last],.7,'前の数を'+r+'倍。'+last+'×'+r+'＝'+ans+'。')}
  {const a=ri(1,20),d0=ri(1,5),inc=ri(1,3);const s=[a];for(let k=0;k<5;k++)s.push(s[k]+d0+k*inc);const ans=s[5]+d0+5*inc;
   addN(s,ans,[s[5]+d0+4*inc,ans+inc,ans-inc],.62,'差が'+d0+'から'+inc+'ずつ増える（'+[0,1,2,3,4].map(k=>d0+k*inc).join(',')+'…）。次の差は'+(d0+5*inc)+'で'+ans+'。')}
  {const t=ri(0,3);let s=[],ans,exp;
   if(t===0){const p=ri(4,9),q=ri(1,p-1);s=[ri(1,9)];for(let k=0;k<6;k++)s.push(k%2?s[k]-q:s[k]+p);ans=s[6]+p;exp='+'+p+'と−'+q+'の繰り返し。'}
   else if(t===1){const c=ri(1,4);s=[ri(1,4)];for(let k=0;k<6;k++)s.push(k%2?s[k]+c:s[k]*2);ans=s[6]*2;exp='×2と+'+c+'の繰り返し。'}
   else if(t===2){const c=ri(1,3);s=[ri(2,5)];for(let k=0;k<5;k++)s.push(k%2?s[k]-c:s[k]*3);ans=s[5]*3;exp='×3と−'+c+'の繰り返し。'}
   else{const p=ri(2,6);s=[ri(1,5)];for(let k=0;k<6;k++)s.push(k%2?s[k]*2:s[k]+p);ans=s[6]+p;exp='+'+p+'と×2の繰り返し。'}
   addN(s,ans,[ans+1,s[s.length-1]*2,s[s.length-1]-1],.55,exp+'次は'+ans+'。')}
  {const a=ri(1,15),d1=ri(2,6),b=ri(20,40),d2=-ri(1,4);const A=k=>a+k*d1,B=k=>b+k*d2;const s=[A(0),B(0),A(1),B(1),A(2),B(2),A(3)];const ans=B(3);
   addN(s,ans,[A(4),B(2)-d2*2,ans-1],.52,'1つおきに見ると、'+d1+'ずつ増える列と'+(-d2)+'ずつ減る列の2本。次は減る列の'+ans+'。')}
  {const cube=R()<.3,s0=cube?1:ri(1,5),k=ri(-2,5);const f=n=>(cube?n*n*n:n*n)+k;const s=[0,1,2,3,4].map(j=>f(s0+j));const ans=f(s0+5);

HARD.forEach(x=>RAW.push(Object.assign({extra:true},x)));
const QUICK_IDS=['M01','M04','M07','M09','S03','R02','N01','N02','N04','V02','V07','V09','V10','A02','A04','A07','L02','L04','W02','W05'];

/* 数唱：f=順唱 b=逆唱 s=小さい順に並べ替え（WAIS「数整列」形式） */
const spanAns=it=>(it.dir==='f'?it.seq:it.dir==='b'?it.seq.slice().reverse():it.seq.slice().sort((x,y)=>x-y)).join('');
const spanDir=it=>it.dir==='f'?'表示された順番どおり':it.dir==='b'?'表示されたのと逆の順番':'小さい数から大きい数の順に並べ替えて';
const spanName=it=>it.dir==='f'?'順唱':it.dir==='b'?'逆唱':'数整列';
function build(it){
  const a=it.a||1;
  if(it.type==='span'){const b=bFrom(it.p,0,a);return Object.assign({},it,{c:0,a:a,b:b,iq:Math.round(100+15*b),q:(it.dir==='f'?'順番どおり':it.dir==='b'?'逆の順番で':'小さい順に並べ替えて')+'入力：'+it.seq.length+'桁'})}
  const order=shuffle(it.opts.map((_,i)=>i),hash(it.id));
  const opts=order.map(i=>it.opts[i]);const ans=order.indexOf(0);
  const c=1/opts.length;const b=bFrom(it.p,c,a);
  return Object.assign({},it,{type:it.type||'mc',opts:opts,ans:ans,c:c,a:a,b:b,iq:Math.round(100+15*b)});
}
const BANK=RAW.map(build);
const FULL=BANK.filter(it=>!it.solo&&!it.extra);
const bandOf=iq=>iq<110?'b1':iq<120?'b2':iq<130?'b3':'b4';

/* ---------- scoring ---------- */
function score(items,answers){
  const resp=items.map(it=>answers[it.id]&&answers[it.id].u?1:0);
  const o=eap(items,resp);
  const idx={};
  Object.keys(INDEX_NAME).forEach(k=>{const sub=[];items.forEach((it,i)=>{if(INDEX[it.dom]===k)sub.push([it,resp[i]])});if(sub.length>=2){const e=eap(sub.map(x=>x[0]),sub.map(x=>x[1]));idx[k]={iq:Math.round(100+15*e.theta),n:sub.length,correct:sub.filter(x=>x[1]).length}}});
  return{iq:Math.round(100+15*o.theta),ci:Math.round(1.645*o.sd*15),pct:Phi(o.theta),theta:o.theta,sd:o.sd,correct:resp.filter(x=>x).length,total:items.length,idx:idx};
}
function classify(iq){return iq>=130?'非常に高い':iq>=120?'高い':iq>=110?'平均の上':iq>=90?'平均':iq>=80?'平均の下':iq>=70?'低い':'非常に低い'}
function rarity(pct){if(pct>=0.5){const top=(1-pct)*100;const n=Math.min(1000000,Math.round(1/Math.max(1e-6,1-pct)));return'上位'+(top<10?top.toFixed(1):Math.round(top))+'%・'+n.toLocaleString()+'人に1人'}return'下位'+(pct*100<10?(pct*100).toFixed(1):Math.round(pct*100))+'%'}

const SG={T:[14,14,86,14],B:[14,86,86,86],L:[14,14,14,86],R:[86,14,86,86],D1:[14,14,86,86],D2:[86,14,14,86],H:[14,50,86,50],V:[50,14,50,86]};
function shapePath(s,cx,cy,r,rot){
  const pts=(n,off)=>{const a=[];for(let i=0;i<n;i++){const ang=(off+i*360/n+rot)*Math.PI/180;a.push([cx+r*Math.cos(ang),cy+r*Math.sin(ang)])}return a};
  const poly=p=>'M'+p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join('L')+'Z';
  const xf=p=>{const t=rot*Math.PI/180;return poly(p.map(q=>[cx+r*(q[0]*Math.cos(t)-q[1]*Math.sin(t)),cy+r*(q[0]*Math.sin(t)+q[1]*Math.cos(t))]))};
  switch(s){
    case'cir':return'M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1,0 '+(2*r)+',0a'+r+','+r+' 0 1,0 '+(-2*r)+',0Z';
    case'sq':return poly(pts(4,-45));
    case'dia':return poly(pts(4,-90));
    case'tri':return poly(pts(3,-90));
    case'pent':return poly(pts(5,-90));

  go('result',{res:res,used:used,items:items,answers:answers,mode:mode,rank:null});
  send({kind:'test',uid:anonId(),device:device(),mode:mode,iq:res.iq,ci:res.ci,correct:res.correct,total:res.total,used:used,
    idx:{pr:res.idx.pr&&res.idx.pr.iq,vc:res.idx.vc&&res.idx.vc.iq,ql:res.idx.ql&&res.idx.ql.iq,wm:res.idx.wm&&res.idx.wm.iq},
    details:items.map(it=>{const a=answers[it.id];return{id:it.id,dom:it.dom,lvl:it.iq,p:it.p,u:a&&a.u?1:0,ans:a?1:0,t:a?a.t:null}})},
    r=>{if(S.screen!=='result'&&S.screen!=='review')return;S.rank=r;const el=document.getElementById('rank');if(el)el.innerHTML=rankHTML(r)});
}
function rankHTML(r){if(!r||!r.n)return'';return'参加者 <b>'+r.n.toLocaleString()+'</b> 人中 <b>'+r.rank.toLocaleString()+'</b> 位（'+MODE_NAME[S.mode]+'・平均IQ '+r.avg+'）'}

/* ---------- result ---------- */
function domStats(){return Object.keys(DOM).map(k=>{const its=S.items.filter(x=>x.dom===k);if(!its.length)return null;const c=its.filter(x=>S.answers[x.id]&&S.answers[x.id].u).length;return{k:k,name:DOM[k],c:c,t:its.length}}).filter(Boolean)}
function result(){
  const r=S.res;const ds=domStats();const isPC=window.innerWidth>=960;
  const idxHTML=Object.keys(INDEX_NAME).map(k=>{const v=r.idx[k];if(!v)return'';const w=Math.max(4,Math.min(100,(v.iq-55)/90*100));return'<div class="irow"><span class="iname">'+INDEX_NAME[k]+'</span><div class="bar big"><i style="width:'+w+'%"></i></div><b class="inum">'+v.iq+'</b></div>'}).join('');
  app.innerHTML='<div class="wrap">'+head('home','ホーム')+
  '<div class="card rcard"><div class="rlabel">'+MODE_NAME[S.mode]+'の結果　推定IQ</div><div class="iq">'+r.iq+'</div><div class="ci">90%信頼区間 '+(r.iq-r.ci)+'〜'+(r.iq+r.ci)+'</div><div class="cls">'+classify(r.iq)+'</div><div class="pct">'+rarity(r.pct)+'</div><div class="meta">正答 '+r.correct+' / '+r.total+'　所要時間 '+fmt(S.used)+'</div>'+(ONLINE?'<div class="meta" id="rank">'+(S.rank?rankHTML(S.rank):'みんなの結果と比べています…')+'</div>':'')+'</div>'+
  '<div class="grid2"><div class="card"><h3>4つの指標</h3>'+idxHTML+'<p class="note">平均100・標準偏差15のスケール（WAISと同じ）。</p></div><div class="card"><h3>分野別の正答率</h3>'+radarSVG(ds.map(d=>d.c/d.t),ds.map(d=>d.name))+'</div></div>'+
  (isPC?'<div class="card"><h3>分野別の内訳</h3><table class="tbl"><tr><th>分野</th><th>正答</th><th>正答率</th><th>最も難しかった正解</th></tr>'+ds.map(d=>{const best=S.items.filter(x=>x.dom===d.k&&S.answers[x.id]&&S.answers[x.id].u).sort((a,b)=>b.iq-a.iq)[0];return'<tr><td>'+d.name+'</td><td>'+d.c+'/'+d.t+'</td><td>'+Math.round(d.c/d.t*100)+'%</td><td>'+(best?'IQ '+best.iq+'レベル':'—')+'</td></tr>'}).join('')+'</table></div>':'')+
  '<div class="actions"><button type="button" class="btn" data-act="share">結果を共有</button><button type="button" class="btn sec" data-go="review">解答と解説</button><button type="button" class="btn sec" data-start="'+S.mode+'">もう一度</button></div>'+
  '<p class="note">推定値です。臨床用に標準化された検査ではないため、医学的・教育的な判定には使えません。同じ問題を繰り返すと練習効果で高く出ます。</p></div>';
}
function shareText(){const r=S.res;const idx=Object.keys(INDEX_NAME).filter(k=>r.idx[k]).map(k=>INDEX_NAME[k]+' '+r.idx[k].iq).join('／');return'🧠 IQ Lab｜'+MODE_NAME[S.mode]+'\n推定IQ '+r.iq+'（'+rarity(r.pct)+'）\n'+idx+'\n挑戦はこちら → '+appUrl()}
async function share(text){
  try{await navigator.clipboard.writeText(text);toast('結果をコピーしました');return}catch(e){}
  const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('結果をコピーしました')}catch(e){toast('コピーできませんでした')}ta.remove();
}

/* ---------- review ---------- */
function review(){
  app.innerHTML='<div class="wrap">'+head('result','結果に戻る')+'<h2>解答と解説</h2><p class="lead">各問題の「IQ◯◯レベル」は、その問題を50%の確率で解ける人の推定IQです。</p>'+
  S.items.map(it=>{const a=S.answers[it.id];const ok=!!(a&&a.u);
    let body;
    if(it.type==='span')body='<p class="qtext small">'+spanName(it)+' '+it.seq.length+'桁：'+it.seq.join(' ')+'</p><p class="exp">正解は '+spanAns(it)+(a&&a.val?'　あなたの入力：'+esc(a.val):'')+'</p>';
    else body='<p class="qtext small">'+esc(it.q)+'</p>'+stimHTML(it.stim)+'<div class="ans"><div><div class="al">正解</div>'+optHTML(it,it.opts[it.ans])+'</div>'+(a&&a.sel!=null&&!ok?'<div><div class="al">あなたの回答</div>'+optHTML(it,it.opts[a.sel])+'</div>':'')+'</div><p class="exp">'+esc(it.exp||'')+'</p>';
    return'<div class="card rv '+(ok?'ok':'ng')+'"><div class="rvh"><span class="dom">'+DOM[it.dom]+'</span><span class="mark">'+(ok?'○ 正解':(a?'× 不正解':'× 未回答'))+'</span><span class="lvl2">IQ '+it.iq+'レベル</span></div>'+body+'</div>'}).join('')+
  '<div class="actions"><button type="button" class="btn sec" data-go="result">結果に戻る</button><button type="button" class="btn sec" data-go="home">ホーム</button></div></div>';
}

/* ---------- single challenge ---------- */
const BANDS=[['all','ランダム'],['b1','〜IQ109'],['b2','IQ110〜119'],['b3','IQ120〜129'],['b4','IQ130以上']];
const remainingS=()=>S.limit-(Date.now()-S.start)/1000;
function single(){
  const lv=S.level||'all';
  if(!S.item){app.innerHTML='<div class="wrap">'+head('home','ホーム')+'<h1>一発チャレンジ</h1><p class="lead">1問だけ。制限時間内に解けたら、その問題のIQレベルをクリア。レベルを選んで挑戦。</p><div class="bands">'+BANDS.map(b=>'<button type="button" class="opt band'+(lv===b[0]?' sel':'')+'" data-level="'+b[0]+'">'+b[1]+'</button>').join('')+'</div><div class="center"><button type="button" class="btn" data-act="single-draw">問題を出す</button></div><p class="note">IQレベル＝その問題を50%の確率で解ける人の推定IQ（IRTの難易度パラメータから換算）。</p></div>';return}
  const it=S.item;
  const body=it.type==='span'?'<div class="lvl" style="margin:0 0 8px">この問題は IQ '+it.iq+' レベル</div>'+spanCard(it):'<div class="card"><div class="dom">'+DOM[it.dom]+'</div><span class="lvl">この問題は IQ '+it.iq+' レベル</span><p class="qtext">'+esc(it.q)+'</p>'+stimHTML(it.stim)+optsHTML(it,S.sel)+'<div class="nav"><button type="button" class="btn sec" data-act="single-giveup">わからない</button><button type="button" class="btn" data-act="single-answer"'+(S.sel==null?' disabled':'')+'>回答する</button></div></div>';
  app.innerHTML='<div class="wrap"><div class="thead"><span>一発チャレンジ</span><span class="timer" id="timer">'+(it.type==='span'?'':fmt(remainingS()))+'</span></div><div class="bar"><i id="sbar" style="width:'+(it.type==='span'?0:100)+'%"></i></div><div style="height:14px"></div>'+body+'</div>';
  focusSpan();
}
function singleDraw(){
  const seen=S.seen||[];const lv=S.level||'all';
  const pool=BANK.filter(it=>lv==='all'||bandOf(it.iq)===lv);
  let fresh=pool.filter(it=>!seen.includes(it.id));if(!fresh.length){fresh=pool;seen.length=0}
  const it=fresh[Math.floor(Math.random()*fresh.length)];const limit=LIMITS[it.dom]||90;
  Object.assign(S,{item:it,sel:null,span:null,limit:limit,start:Date.now(),seen:seen.concat([it.id])});render();window.scrollTo(0,0);
  if(it.type!=='span')tick=setInterval(()=>{const r=remainingS();const el=document.getElementById('timer');if(el){el.textContent=fmt(r);el.classList.toggle('low',r<15)}const b=document.getElementById('sbar');if(b)b.style.width=Math.max(0,r/S.limit*100)+'%';if(r<=0)singleFinish(false,null,true)},250);
}
function singleFinish(ok,sel,timeout,val){const it=S.item;const used=Math.round((Date.now()-S.start)/1000);go('sresult',{item:it,ok:ok,sel:sel,timeout:timeout,val:val,level:S.level,seen:S.seen,used:used,stat:null});
  send({kind:'single',uid:anonId(),device:device(),id:it.id,dom:it.dom,lvl:it.iq,p:it.p,u:ok?1:0,used:used,timeout:timeout?1:0},
    r=>{if(S.screen!=='sresult'||S.item!==it)return;S.stat=r;const el=document.getElementById('istat');if(el)el.innerHTML=statHTML(r)})}
function statHTML(r){if(!r||!r.n)return'';return'みんなの正解率 <b>'+Math.round(r.rate*100)+'%</b>（'+r.n.toLocaleString()+'人が挑戦）'}
function sresult(){
  const it=S.item;const ok=S.ok;
  let detail;
  if(it.type==='span')detail='<p class="exp">正解は '+spanAns(it)+(S.val?'　あなたの入力：'+esc(S.val):'')+'</p>';
  else detail='<div class="ans"><div><div class="al">正解</div>'+optHTML(it,it.opts[it.ans])+'</div>'+(S.sel!=null&&!ok?'<div><div class="al">あなたの回答</div>'+optHTML(it,it.opts[S.sel])+'</div>':'')+'</div><p class="exp">'+esc(it.exp||'')+'</p>';
  app.innerHTML='<div class="wrap">'+head('home','ホーム')+'<div class="card"><div class="verdict '+(ok?'ok':'ng')+'">'+(ok?'正解！':(S.timeout?'時間切れ':'不正解'))+'</div><p class="center" style="font-weight:700;font-size:18px">'+(ok?'IQ '+it.iq+' レベルの問題をクリア':'この問題は IQ '+it.iq+' レベル')+'</p><p class="center muted" style="font-size:13px">'+DOM[it.dom]+'　所要 '+S.used+'秒</p>'+(ONLINE?'<p class="center muted" style="font-size:13px" id="istat">'+(S.stat?statHTML(S.stat):'')+'</p>':'')+detail+'</div>'+
  '<div class="actions">'+(ok?'<button type="button" class="btn" data-act="sshare">結果を共有</button>':'')+'<button type="button" class="btn'+(ok?' sec':'')+'" data-act="single-next">次の問題</button><button type="button" class="btn sec" data-go="single">レベルを変える</button></div></div>';
}
function singleShareText(){return'🧠 IQ Lab 一発チャレンジ\nIQ '+S.item.iq+' レベルの問題（'+DOM[S.item.dom]+'）を '+S.used+'秒でクリア！\n挑戦はこちら → '+appUrl()}

/* ---------- method ---------- */
function method(){
  app.innerHTML='<div class="wrap">'+head('home','ホーム')+'<h2>採点の仕組みと問題の出典</h2>'+
  '<div class="card"><h3>問題形式の元になった検査・研究</h3><ul class="src">'+
  '<li><b>行列推理</b>：Raven\'s Progressive Matrices（1938〜）、WAIS 行列推理、Cattell Culture Fair Test と同形式。流動性知能（g因子）の測定に最も広く使われる形式。</li>'+
  '<li><b>図形系列</b>：Cattell Culture Fair Test「系列」と同形式。</li>'+
  '<li><b>空間認識</b>：心的回転（Shepard & Metzler, 1971）の2次元版、紙折りテスト（ETS Paper Folding Test）、積み木数え。</li>'+
  '<li><b>数的推理</b>：多くの知能検査やメンサ系テストで使われる数列補完。</li>'+
  '<li><b>言語理解</b>：WAIS「類似」「語彙」、類推（A：B＝C：？）形式。結晶性知能の測定。</li>'+
  '<li><b>算数推理</b>：WAIS「算数」、認知反射テスト CRT（Frederick, 2005）。</li>'+
  '<li><b>論理推理</b>：三段論法、Wason選択課題（1966）、騎士と悪党パズル（Smullyan）。</li>'+
  '<li><b>作動記憶</b>：WAIS「数唱」（順唱・逆唱）と同じ手順。1秒に1桁ずつ提示。</li></ul>'+
  '<p class="note">著作権のある検査問題そのものは使用していません。形式・出題理論のみを参照して作成したオリジナル問題です。</p></div>'+
  '<div class="card"><h3>推定方法</h3><p>各問題に難易度（b）・識別力（a）・当て推量（c）を設定した3パラメータ・ロジスティックモデル（3PL IRT）を使い、回答パターンから能力値θをEAP（事後期待値）で推定します。IQ = 100 + 15θ（平均100・標準偏差15、WAISと同じスケール）。</p><p>難易度は一般成人の推定正答率から換算した値で、大規模な標準化データによるものではありません。問題数が少ないほど信頼区間は広がります。一発チャレンジの「IQ◯◯レベル」は、その問題を50%の確率で解ける人のIQ（b）です。</p></div>'+
  '<div class="card"><h3>IQの分類（WAIS-IV の記述分類に準拠）</h3><table class="tbl"><tr><th>IQ</th><th>分類</th><th>人口に占める割合</th></tr><tr><td>130以上</td><td>非常に高い</td><td>約2.3%</td></tr><tr><td>120〜129</td><td>高い</td><td>約6.7%</td></tr><tr><td>110〜119</td><td>平均の上</td><td>約16%</td></tr><tr><td>90〜109</td><td>平均</td><td>約50%</td></tr><tr><td>80〜89</td><td>平均の下</td><td>約16%</td></tr><tr><td>70〜79</td><td>低い</td><td>約6.7%</td></tr><tr><td>69以下</td><td>非常に低い</td><td>約2.3%</td></tr></table></div>'+
  '<div class="card"><h3>結果の読み方・注意</h3><p>同じ問題を繰り返すと練習効果で高く出ます。体調・集中・時間帯でも変動します。本テストは娯楽・教養目的であり、医学的・教育的な判定、就職・入学などの判断には使えません。</p></div></div>';
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-start],[data-act],[data-opt],[data-level]');if(!b)return;
  if(b.dataset.go){const g=b.dataset.go;
    if(g==='review')return go('review',{items:S.items,answers:S.answers,res:S.res,mode:S.mode,used:S.used,rank:S.rank});
    if(g==='result')return go('result',{items:S.items,answers:S.answers,res:S.res,mode:S.mode,used:S.used,rank:S.rank});
    if(g==='single')return go('single',{level:S.level||'all',seen:S.seen||[]});
    return go(g)}
  if(b.dataset.start)return startTest(b.dataset.start);
  if(b.dataset.level){S.level=b.dataset.level;return render()}
  if(b.dataset.opt!=null){S.sel=+b.dataset.opt;app.querySelectorAll('.opt[data-opt]').forEach(x=>x.classList.toggle('sel',+x.dataset.opt===S.sel));const nb=app.querySelector('[data-act="next"],[data-act="single-answer"]');if(nb)nb.disabled=false;return}
  const act=b.dataset.act;const it=S.screen==='test'?S.items[S.idx]:S.item;
  if(act==='intro'){S.intro=false;S.qStart=Date.now();return render()}
  if(act==='skip'){record(false,null);return next()}
  if(act==='next'){if(S.sel==null)return;record(S.sel===it.ans,S.sel);return next()}
  if(act==='span-start')return spanStart(it);
  if(act==='span-submit'){const c=spanCheck(it);if(S.screen==='test'){record(c.u,null);S.answers[it.id].val=c.val;return next()}return singleFinish(c.u,null,false,c.val)}
  if(act==='share')return share(shareText());
  if(act==='sshare')return share(singleShareText());
  if(act==='single-draw')return singleDraw();
  if(act==='single-answer'){if(S.sel==null)return;return singleFinish(S.sel===it.ans,S.sel,false)}
  if(act==='single-giveup')return singleFinish(false,null,false);
  if(act==='single-next'){go('single',{level:S.level,seen:S.seen});return singleDraw()}
});
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter'){const b=app.querySelector('[data-act="span-submit"]');if(b)b.click()}return}
  if(S.screen!=='test'&&S.screen!=='single')return;
  if(/^[1-9]$/.test(e.key)){const b=app.querySelector('[data-opt="'+(+e.key-1)+'"]');if(b)b.click()}
  else if(e.key==='Enter'){const b=app.querySelector('[data-act="next"],[data-act="single-answer"],[data-act="intro"],[data-act="span-start"],[data-act="single-draw"]');if(b&&!b.disabled)b.click()}
  else if(e.key==='s'||e.key==='S'){const b=app.querySelector('[data-act="skip"]');if(b)b.click()}
});
render();
})();
</script>

</body>
